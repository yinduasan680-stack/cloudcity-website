<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirecting… — CloudCityFood</title>
<meta name="robots" content="noindex">
<link rel="icon" href="icons/favicon.ico">
<script>
(function(){
  var p=new URLSearchParams(location.search);
  var tab=p.get('tab'), lang=p.get('lang');
  var q=lang?('?lang='+encodeURIComponent(lang)):'';
  var dest;
  if(tab==='merchant-agreement') dest='merchant-agreement.html'+q;
  else if(tab==='rider-agreement') dest='rider-agreement.html'+q;
  else dest='terms.html'+q;   /* user-agreement / privacy / none -> service terms */
  location.replace(dest);
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=terms.html"></noscript>
<style>body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:#fff;color:#333;display:flex;min-height:100vh;margin:0;align-items:center;justify-content:center;text-align:center}a{color:#8818B8}</style>
</head>
<body>
<div>
  <p>Redirecting…</p>
  <p><a href="terms.html">Continue to Terms &amp; Conditions ›</a></p>
</div>
</body>
</html>
